name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven + Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Publish test summary as annotations
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          for f in glob.glob('target/surefire-reports/TEST-*.xml') + glob.glob('target/failsafe-reports/TEST-*.xml'):
              suite = ET.parse(f).getroot()
              total += int(suite.get('tests', 0)); skipped += int(suite.get('skipped', 0))
              for case in suite.iter('testcase'):
                  for kind in ('failure', 'error'):
                      el = case.find(kind)
                      if el is not None:
                          failed += 1
                          msg = (el.get('message') or el.text or '').replace('\n', ' ')[:900]
                          print(f"::error title={case.get('classname')}.{case.get('name')}::{kind}: {msg}")
          print(f"::notice title=Backend tests::total={total} failed={failed} skipped={skipped}")
          PY
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      - name: Publish test summary as annotations
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, os
          f = 'test-results/junit.xml'
          if not os.path.exists(f):
              print('::error title=Frontend tests::no se generó el informe'); raise SystemExit
          root = ET.parse(f).getroot()
          total = failed = 0
          for case in root.iter('testcase'):
              total += 1
              for kind in ('failure', 'error'):
                  el = case.find(kind)
                  if el is not None:
                      failed += 1
                      msg = (el.get('message') or el.text or '').replace('\n', ' ')[:900]
                      print(f"::error title={case.get('classname')} > {case.get('name')}::{msg}")
          print(f"::notice title=Frontend tests::total={total} failed={failed}")
          PY
      - run: npm run build

  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Create .env with throwaway secrets
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          echo "SMOKE_DEMO_PASSWORD=$(openssl rand -hex 12)" >> "$GITHUB_ENV"
      - name: Start stack
        run: |
          sed -i "s/^DEMO_USER_PASSWORD=.*/DEMO_USER_PASSWORD=${SMOKE_DEMO_PASSWORD}/" .env
          docker compose up -d --build --wait --wait-timeout 240
      - name: Login and query the catalog through nginx
        run: |
          set -euo pipefail
          base=http://localhost:8081
          jar=$(mktemp)
          curl -fsS "$base/healthz"
          curl -fsS -c "$jar" -b "$jar" "$base/api/v1/auth/csrf" > /dev/null
          token=$(awk '$6=="XSRF-TOKEN"{print $7}' "$jar")
          curl -fsS -c "$jar" -b "$jar" -H "X-XSRF-TOKEN: $token" -H 'Content-Type: application/json' \
            -d "{\"username\":\"demo\",\"password\":\"${SMOKE_DEMO_PASSWORD}\"}" "$base/api/v1/auth/login" | grep -q '"username":"demo"'
          curl -fsS -b "$jar" "$base/api/v1/catalog/versions" | grep -q 'DEMO-EDU-1'
          curl -fsS "$base/" | grep -q '<div id="root">'
          echo "::notice title=Compose smoke::stack arrancó; login y catálogo OK a través de nginx"
      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200 backend | sed 's/^/::error title=backend log::/' | tail -60
      - name: Tear down
        if: always()
        run: docker compose down -v
