name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven + Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Publish test summary as annotations
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          for f in glob.glob('target/surefire-reports/TEST-*.xml') + glob.glob('target/failsafe-reports/TEST-*.xml'):
              suite = ET.parse(f).getroot()
              total += int(suite.get('tests', 0)); skipped += int(suite.get('skipped', 0))
              for case in suite.iter('testcase'):
                  for kind in ('failure', 'error'):
                      el = case.find(kind)
                      if el is not None:
                          failed += 1
                          msg = (el.get('message') or el.text or '').replace('\n', ' ')[:900]
                          print(f"::error title={case.get('classname')}.{case.get('name')}::{kind}: {msg}")
          print(f"::notice title=Backend tests::total={total} failed={failed} skipped={skipped}")
          PY
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
