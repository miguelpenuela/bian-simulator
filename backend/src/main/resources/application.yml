spring:
  application:
    name: bian-simulator
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bian_simulator}
    username: ${DB_USERNAME:bian}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
        name: BIANSESSION

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs

app:
  security:
    login:
      max-failed-attempts: 5
      lockout-window: 15m
    cors:
      # Vacío = sin CORS (SPA servida desde el mismo origen). Separar con comas.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  demo:
    user:
      username: ${DEMO_USER_USERNAME:demo}
      # Sin valor por defecto: el usuario demo solo se crea si se define.
      password: ${DEMO_USER_PASSWORD:}

---
spring:
  config:
    activate:
      on-profile: dev,demo
  flyway:
    locations: classpath:db/migration,classpath:db/demo

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
